<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>AXIOS OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #09090b;
        color: #fafafa;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        letter-spacing: 0.06em;
      }
      p {
        margin: 0 0 0.75rem;
        max-width: 22rem;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      code {
        color: #93c5fd;
        font-size: 0.78rem;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>AXIOS OS</h1>
      <p>
        Cannot reach the Next.js server. Start it on your PC, then reopen the
        app.
      </p>
      <p>
        Emulator: run <code>npm run mobile:emu</code><br />
        Phone: use your LAN IP in <code>CAPACITOR_SERVER_URL</code>
      </p>
      <a id="retry" href="http://127.0.0.1:3000/auth/login">Open login</a>
    </div>
    <script>
      // Prefer configured host when available.
      var target = "http://192.168.254.135:3000/auth/login";
      document.getElementById("retry").href = target;
      // Auto-retry once after a short delay.
      setTimeout(function () {
        window.location.replace(target);
      }, 1200);
    </script>
  </body>
</html>
