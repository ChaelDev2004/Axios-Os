<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>AXIOS OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #09090b;
        color: #fafafa;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        letter-spacing: 0.06em;
      }
      p {
        margin: 0 0 0.75rem;
        max-width: 22rem;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      code {
        color: #93c5fd;
        font-size: 0.78rem;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>AXIOS OS</h1>
      <p>
        Cannot reach AXIOS OS. Check your internet connection, then reopen the
        app.
      </p>
      <p>
        Production:
        <code>https://axios-os-one.vercel.app</code>
      </p>
      <a id="retry" href="https://axios-os-one.vercel.app/auth/login"
        >Open login</a
      >
    </div>
    <script>
      var target = "https://axios-os-one.vercel.app/auth/login";
      document.getElementById("retry").href = target;
      setTimeout(function () {
        window.location.replace(target);
      }, 1200);
    </script>
  </body>
</html>
